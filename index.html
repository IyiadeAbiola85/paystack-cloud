<!-- The entire HTML body is identical, so we skip reprinting it. Only the script changes. -->

<script>
/* ── Bank Code Mapping ── */
const BACKEND_URL = 'https://paystack-cloud.onrender.com';
const bankList = [
  { name: 'PayStack Cloud', code: '999' },
  { name: 'Access Bank', code: '044' },
  { name: 'First Bank', code: '011' },
  { name: 'GTBank (Guaranty Trust)', code: '058' },
  { name: 'Zenith Bank', code: '057' },
  { name: 'UBA (United Bank for Africa)', code: '033' },
  { name: 'Fidelity Bank', code: '070' },
  { name: 'Union Bank', code: '032' },
  { name: 'Stanbic IBTC', code: '221' },
  { name: 'FCMB', code: '214' },
  { name: 'Sterling Bank', code: '232' },
  { name: 'Keystone Bank', code: '082' },
  { name: 'Polaris Bank', code: '076' },
  { name: 'Wema Bank / ALAT', code: '035' },
  { name: 'Ecobank Nigeria', code: '050' },
  { name: 'Opay', code: '999' },
  { name: 'Kuda Bank', code: '502' },
  { name: 'PalmPay', code: '999' },
  { name: 'Moniepoint', code: '999' }
];

/* ── State ── */
let currentTransferData = {};
let pinValue = '';
let accounts = {};
let transactions = [];
let beneficiaries = [];

/* ── Populate bank dropdown (safe) ── */
function populateBankDropdown() {
  const bankSelect = document.getElementById('recipientBank');
  if (!bankSelect) {
    console.warn('Bank dropdown element (#recipientBank) not found.');
    return;
  }
  bankList.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.code;
    opt.textContent = b.name;
    bankSelect.appendChild(opt);
  });
}

/* ── Toast (fallback if element missing) ── */
function ensureToast() {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    toast.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span id="toastMsg">Done</span>';
    document.body.appendChild(toast);
    console.warn('Toast element was missing – created dynamically.');
  }
  return toast;
}

/* ── Load initial data ── */
async function loadDashboard() {
  try {
    const accRes = await fetch(`${BACKEND_URL}/api/accounts`);
    accounts = await accRes.json();
    renderAccountCards();
    updateStats();

    const txnRes = await fetch(`${BACKEND_URL}/api/transactions`);
    transactions = await txnRes.json();
    renderTxnTable();

    const benefRes = await fetch(`${BACKEND_URL}/api/beneficiaries`);
    beneficiaries = await benefRes.json();
    renderBenefChips();
    renderBenefCards();
  } catch (err) {
    console.error('Failed to load data:', err);
    showToast('Could not load dashboard data.', 'error');
  }
}

/* ── Render Account Cards ── */
function renderAccountCards() {
  const container = document.getElementById('accountCards');
  if (!container) {
    console.error('Element #accountCards not found – cannot render accounts.');
    return;
  }
  const map = {
    inv: { cls: 'inv', label: 'Investment Account' },
    cur: { cls: 'cur', label: 'Current Account' },
    sav: { cls: 'sav', label: 'Savings Account' }
  };
  container.innerHTML = Object.keys(accounts).map(key => {
    const acc = accounts[key];
    const info = map[key];
    return `
      <div class="account-card ${info.cls}" onclick="openTransferWithAccount('${info.label}','${acc.acct}')">
        <div class="card-pattern"></div>
        <div class="card-pattern2"></div>
        <div class="card-type">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          ${info.label}
        </div>
        <div class="card-balance">₦${acc.balance.toLocaleString('en-NG', {minimumFractionDigits:2})}</div>
        <div class="card-label">Available Balance</div>
        <div class="card-acct-no">Acct No: ${acc.acct}</div>
        <div class="card-actions">
          <button class="card-btn" onclick="event.stopPropagation(); openTransferWithAccount('${info.label}','${acc.acct}')">Transfer</button>
          <button class="card-btn" onclick="event.stopPropagation();">Top Up</button>
          <button class="card-btn" onclick="event.stopPropagation();">Details</button>
        </div>
      </div>
    `;
  }).join('');

  // Populate source account select
  const srcSelect = document.getElementById('sourceAccount');
  if (srcSelect) {
    srcSelect.innerHTML = '<option value="">-- Select Source Account --</option>';
    Object.keys(accounts).forEach(key => {
      const acc = accounts[key];
      const label = `${acc.name} (₦${acc.balance.toLocaleString('en-NG', {minimumFractionDigits:2})})`;
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = label;
      srcSelect.appendChild(opt);
    });
  }
}

/* ── Update Stats ── */
function updateStats() {
  const statsRow = document.getElementById('statsRow');
  if (!statsRow) {
    console.warn('Element #statsRow not found – stats will not be rendered.');
    return;
  }
  const total = Object.values(accounts).reduce((sum, a) => sum + a.balance, 0);
  statsRow.innerHTML = `
    <div class="stat-card">
      <div class="st-label">Total Portfolio</div>
      <div class="st-val">₦${total.toLocaleString('en-NG', {minimumFractionDigits:2})}</div>
      <div class="st-change">↑ +4.2% this month</div>
    </div>
    <div class="stat-card">
      <div class="st-label">Transfers This Month</div>
      <div class="st-val">24</div>
      <div class="st-change">↑ +6 from last month</div>
    </div>
    <div class="stat-card">
      <div class="st-label">Pending Transactions</div>
      <div class="st-val">2</div>
      <div class="st-change neg">Action required</div>
    </div>
    <div class="stat-card">
      <div class="st-label">Investment Yield</div>
      <div class="st-val">12.4% p.a.</div>
      <div class="st-change">↑ Above market avg</div>
    </div>
  `;
}

/* ── Render Transactions Table ── */
function renderTxnTable() {
  const body = document.getElementById('recentTxnBody');
  if (!body) {
    console.warn('Element #recentTxnBody not found – transactions not rendered.');
    return;
  }
  body.innerHTML = transactions.slice(0,8).map(t => `
    <tr>
      <td><div class="txn-name-cell">
        <div class="txn-avatar" style="background:${t.type==='credit'?'#ECFDF5':'#EBF0FD'};color:${t.type==='credit'?'#0D9488':'#1A56DB'}">
          ${t.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
        </div>
        <div><div style="font-weight:600">${t.name}</div><div style="font-size:.74rem;color:var(--clr-muted)">${t.bank}</div></div>
      </div></td>
      <td style="font-size:.8rem;color:var(--clr-muted)">${t.from}</td>
      <td style="font-size:.8rem">${t.date}</td>
      <td class="txn-amount ${t.type}">${t.type==='debit'?'-':'+'}${fmtNaira(Math.abs(t.amount))}</td>
      <td><span class="txn-status ${t.status}">● ${t.status.charAt(0).toUpperCase()+t.status.slice(1)}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="viewTxn('${t.ref}')">View</button></td>
    </tr>
  `).join('');

  const hBody = document.getElementById('historyTxnBody');
  if (hBody) {
    hBody.innerHTML = transactions.map(t => `
      <tr>
        <td><div class="txn-name-cell">
          <div class="txn-avatar" style="background:${t.type==='credit'?'#ECFDF5':'#EBF0FD'};color:${t.type==='credit'?'#0D9488':'#1A56DB'}">
            ${t.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
          </div>
          <div><div style="font-weight:600">${t.name}</div><div style="font-size:.74rem;color:var(--clr-muted)">${t.bank}</div></div>
        </div></td>
        <td style="font-size:.8rem;color:var(--clr-muted)">${t.from}</td>
        <td style="font-family:var(--font-num);font-size:.78rem">${t.ref}</td>
        <td style="font-size:.8rem">${t.date}</td>
        <td class="txn-amount ${t.type}">${t.type==='debit'?'-':'+'}${fmtNaira(Math.abs(t.amount))}</td>
        <td><span class="txn-status ${t.status}">● ${t.status.charAt(0).toUpperCase()+t.status.slice(1)}</span></td>
      </tr>
    `).join('');
  }
}

function viewTxn(ref) {
  const t = transactions.find(x => x.ref === ref);
  if (t) showToast('Ref: ' + ref, 'success');
}

/* ── Render Beneficiaries ── */
function renderBenefChips() {
  const list = document.getElementById('benefList');
  if (!list) return;
  if (!beneficiaries.length) {
    list.innerHTML = '<span class="text-muted" style="font-size:.8rem;">No saved beneficiaries</span>';
    return;
  }
  list.innerHTML = beneficiaries.map(b => `
    <div class="benef-chip" onclick="fillBeneficiary('${b.acct}','${b.name}','${b.bank}', this)">
      <div class="benef-avatar" style="background:${b.color || '#7C3AED'}">${b.initials}</div>
      <span class="benef-name">${b.name.split(' ')[0]}</span>
    </div>
  `).join('');
}

function renderBenefCards() {
  const grid = document.getElementById('benefCardsGrid');
  if (!grid) return;
  if (!beneficiaries.length) {
    grid.innerHTML = '<div class="text-muted" style="grid-column:1/-1;text-align:center;padding:40px 0;">No saved beneficiaries yet.</div>';
    return;
  }
  grid.innerHTML = beneficiaries.map(b => `
    <div class="account-card" style="background:${b.color || '#7C3AED'};color:#fff;">
      <div class="card-pattern"></div>
      <div class="card-type"><div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800">${b.initials}</div>${b.name}</div>
      <div class="card-label" style="margin-top:6px;">${b.bank}</div>
      <div class="card-acct-no">${b.acct}</div>
      <div class="card-actions">
        <button class="card-btn" onclick="openTransferWithAccount('Current Account',''); document.getElementById('recipientAcct').value='${b.acct}'; verifyAccount(document.getElementById('recipientAcct')); showSection('transfer');">Transfer</button>
        <button class="card-btn">Edit</button>
        <button class="card-btn" style="border-color:rgba(255,100,100,.5);color:rgba(255,150,150,1);">Remove</button>
      </div>
    </div>
  `).join('');
}

function fillBeneficiary(acct, name, bank, chip) {
  document.querySelectorAll('.benef-chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  document.getElementById('recipientAcct').value = acct;
  document.getElementById('recipientName').value = name;
  const verifiedEl = document.getElementById('verifiedName');
  if (verifiedEl) {
    verifiedEl.textContent = '✓ ' + name + ' verified';
    verifiedEl.style.display = 'block';
  }
  const bankSel = document.getElementById('recipientBank');
  if (bankSel) {
    for (const opt of bankSel.options) {
      if (opt.text.toLowerCase().includes(bank.toLowerCase())) { bankSel.value = opt.value; break; }
    }
  }
}

/* ── Account Verification ── */
async function verifyAccount(inp) {
  const acct = inp.value.replace(/\D/g, '');
  inp.value = acct;
  const verifiedEl = document.getElementById('verifiedName');
  const nameField = document.getElementById('recipientName');
  const bankCode = document.getElementById('recipientBank')?.value;

  if (acct.length === 10 && bankCode) {
    try {
      const resp = await fetch(`${BACKEND_URL}/api/verify-account`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accountNumber: acct, bankCode })
      });
      const data = await resp.json();
      if (verifiedEl && nameField) {
        if (data.success) {
          nameField.value = data.data.account_name;
          verifiedEl.style.display = 'block';
          verifiedEl.textContent = `✓ ${data.data.account_name} verified`;
          verifiedEl.style.color = 'var(--clr-success)';
        } else {
          verifiedEl.style.display = 'block';
          verifiedEl.textContent = '✗ ' + data.message;
          verifiedEl.style.color = 'var(--clr-danger)';
        }
      }
    } catch (err) {
      console.error(err);
      showToast('Verification failed', 'error');
    }
  } else {
    if (verifiedEl) verifiedEl.style.display = 'none';
    if (nameField) nameField.value = '';
  }
}

/* ── Transfer Steps ── */
function goToStep1() { setStep(1); }
function goToStep2() {
  // Validate
  let valid = true;
  const src = document.getElementById('sourceAccount')?.value;
  const bank = document.getElementById('recipientBank')?.value;
  const acct = document.getElementById('recipientAcct')?.value;
  const rawAmount = document.getElementById('amount')?.value || '';
  const cleaned = rawAmount.replace(/,/g, '');
  const amt = parseFloat(cleaned);

  if (!src) { showErr('errSource'); valid = false; } else hideErr('errSource');
  if (!bank) { showErr('errBank'); valid = false; } else hideErr('errBank');
  if (!acct || acct.length < 10) { showErr('errAcct'); valid = false; } else hideErr('errAcct');
  if (!amt || amt <= 0) { showErr('errAmount'); valid = false; } else hideErr('errAmount');
  if (!valid) { showToast('Please fill all required fields.', 'error'); return; }

  const narr = document.getElementById('narration')?.value || 'Fund Transfer';
  const recName = document.getElementById('recipientName')?.value || 'Recipient';
  const srcAcc = accounts[src];

  if (!srcAcc) {
    showToast('Source account not found.', 'error');
    return;
  }

  currentTransferData = {
    source: srcAcc.name,
    sourceKey: src,
    bank,
    acct,
    name: recName,
    amount: amt,
    narration: narr,
    date: document.getElementById('transferDate')?.value || '2026-07-31',
    priority: document.getElementById('priority')?.value || 'normal',
    fee: 50
  };

  const large = amt > 1000000;
  const warnEl = document.getElementById('largeAmtWarning');
  if (warnEl) warnEl.style.display = large ? 'flex' : 'none';

  const reviewBox = document.getElementById('reviewBox');
  if (reviewBox) {
    reviewBox.innerHTML = `
      <div class="review-row"><span class="rl">Source Account</span><span class="rv">${currentTransferData.source}</span></div>
      <div class="review-row"><span class="rl">Recipient Bank</span><span class="rv">${bankList.find(b => b.code === currentTransferData.bank)?.name || currentTransferData.bank}</span></div>
      <div class="review-row"><span class="rl">Account Number</span><span class="rv">${currentTransferData.acct}</span></div>
      <div class="review-row"><span class="rl">Account Name</span><span class="rv">${currentTransferData.name}</span></div>
      <div class="review-row"><span class="rl">Narration</span><span class="rv">${currentTransferData.narration}</span></div>
      <div class="review-row"><span class="rl">Transfer Date</span><span class="rv">${currentTransferData.date}</span></div>
      <div class="review-row"><span class="rl">Priority</span><span class="rv">${currentTransferData.priority.charAt(0).toUpperCase()+currentTransferData.priority.slice(1)}</span></div>
      <div class="review-row"><span class="rl">Amount</span><span class="rv">${fmtNaira(currentTransferData.amount)}</span></div>
      <div class="review-row"><span class="rl">Transaction Fee</span><span class="rv">₦50.00</span></div>
      <div class="review-total"><span>Total Debit</span><span class="rv">${fmtNaira(currentTransferData.amount + 50)}</span></div>
    `;
  }
  setStep(2);
}

function goToStep3() {
  pinValue = '';
  updatePinDots();
  document.getElementById('pinAmountLabel').textContent = fmtNaira(currentTransferData.amount);
  const bankName = bankList.find(b => b.code === currentTransferData.bank)?.name || currentTransferData.bank;
  document.getElementById('pinRecipientLabel').textContent = currentTransferData.name + ' · ' + bankName;
  setStep(3);
}

function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('transferStep' + i);
    if (el) el.classList.remove('visible');
    if (i === n && el) el.classList.add('visible');
    const dot = document.getElementById('stepDot' + i);
    if (dot) {
      dot.classList.remove('active', 'done');
      if (i < n) dot.classList.add('done');
      else if (i === n) dot.classList.add('active');
    }
    const circle = document.getElementById('stepCircle' + i);
    if (circle) {
      if (i < n) circle.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      else circle.textContent = i;
    }
  }
}

/* ── PIN ── */
function pinPress(digit) {
  if (pinValue.length >= 4) return;
  pinValue += digit;
  updatePinDots();
  if (pinValue.length === 4) { setTimeout(checkPin, 400); }
}
function pinDelete() { pinValue = pinValue.slice(0,-1); updatePinDots(); }
function pinClear()  { pinValue = ''; updatePinDots(); }
function updatePinDots() {
  for (let i = 1; i <= 4; i++) {
    const dot = document.getElementById('pd' + i);
    if (dot) dot.classList.toggle('filled', i <= pinValue.length);
  }
}
function checkPin() {
  if (pinValue.length === 4) {
    const hint = document.getElementById('pinHint');
    if (hint) hint.textContent = 'Authorizing…';
    setTimeout(executeTransfer, 800);
  }
}

/* ── Execute Transfer ── */
async function executeTransfer() {
  const payload = {
    sourceAccount: currentTransferData.sourceKey,
    recipientBank: currentTransferData.bank,
    recipientAcct: currentTransferData.acct,
    amount: currentTransferData.amount,
    narration: currentTransferData.narration,
    saveBenef: document.getElementById('saveBenef')?.checked || false
  };

  try {
    const resp = await fetch(`${BACKEND_URL}/api/transfer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await resp.json();
    if (result.success) {
      const ref = result.reference;
      currentTransferData.ref = ref;
      currentTransferData.timestamp = new Date().toLocaleString('en-NG', {dateStyle:'long',timeStyle:'short'});

      await loadDashboard();

      document.getElementById('txnRefDisplay').textContent = ref;
      document.getElementById('successSubText').textContent =
        `₦${currentTransferData.amount.toLocaleString('en-NG', {minimumFractionDigits:2})} has been sent to ${currentTransferData.name} — ${bankList.find(b => b.code === currentTransferData.bank)?.name || currentTransferData.bank}.`;
      document.getElementById('successSummary').innerHTML = `
        <div class="review-row"><span class="rl">Recipient</span><span class="rv">${currentTransferData.name}</span></div>
        <div class="review-row"><span class="rl">Bank</span><span class="rv">${bankList.find(b => b.code === currentTransferData.bank)?.name || currentTransferData.bank}</span></div>
        <div class="review-row"><span class="rl">Account No.</span><span class="rv">${currentTransferData.acct}</span></div>
        <div class="review-row"><span class="rl">Amount Sent</span><span class="rv">${fmtNaira(currentTransferData.amount)}</span></div>
        <div class="review-row"><span class="rl">Source Account</span><span class="rv">${currentTransferData.source}</span></div>
        <div class="review-row"><span class="rl">Date &amp; Time</span><span class="rv">${currentTransferData.timestamp}</span></div>
      `;
      openModal('successModal');
      const hint = document.getElementById('pinHint');
      if (hint) hint.textContent = 'Enter your 4-digit transaction PIN';
    } else {
      showToast('Transfer failed: ' + result.error, 'error');
    }
  } catch (err) {
    console.error(err);
    showToast('Network error, transfer failed.', 'error');
  }
}

/* ── Print Receipt ── */

  const d = currentTransferData;
  const bankName = bankList.find(b => b.code === d.bank)?.name || d.bank;
  const content = document.getElementById('receiptContent');
  if (!content) return;
  content.innerHTML = `
    <div class="rp-logo">
      <div class="rp-icon">P</div>
      PayStack Cloud
    </div>
    <div class="rp-header-badge">✓ Transfer Successful</div>
    <div class="rp-title">Transfer Receipt</div>
    <div class="rp-date">Issued: ${d.timestamp || new Date().toLocaleString('en-NG')}</div>
    <div class="rp-divider"></div>
    <div class="rp-row"><span class="rp-l">Transaction Reference</span><span class="rp-r">${d.ref || 'N/A'}</span></div>
    <div class="rp-row"><span class="rp-l">Source Account</span><span class="rp-r">${d.source}</span></div>
    <div class="rp-row"><span class="rp-l">Recipient Name</span><span class="rp-r">${d.name}</span></div>
    <div class="rp-row"><span class="rp-l">Recipient Bank</span><span class="rp-r">${bankName}</span></div>
    <div class="rp-row"><span class="rp-l">Account Number</span><span class="rp-r">${d.acct}</span></div>
    <div class="rp-row"><span class="rp-l">Narration</span><span class="rp-r">${d.narration}</span></div>
    <div class="rp-row"><span class="rp-l">Transfer Date</span><span class="rp-r">${d.date}</span></div>
    <div class="rp-row"><span class="rp-l">Amount Transferred</span><span class="rp-r">${fmtNaira(d.amount)}</span></div>
    <div class="rp-row"><span class="rp-l">Transaction Fee</span><span class="rp-r">₦50.00</span></div>
    <div class="rp-total"><span>Total Debit</span><span>${fmtNaira(d.amount + 50)}</span></div>
    <div class="rp-divider"></div>
    <div class="rp-footer">
      PayStack Cloud Banking Portal · This is an auto-generated receipt.<br>
      For queries: support@paystackcloud.ng · 0700-PAYSTACK<br>
      Reference: ${d.ref}
    </div>
  `;
  document.getElementById('receiptArea').style.display = 'block';
  window.print();
  setTimeout(() => { document.getElementById('receiptArea').style.display = 'none'; }, 500);
}

function shareReceipt() {
  const text = `PayStack Cloud Transfer\nRef: ${currentTransferData.ref}\nAmount: ${fmtNaira(currentTransferData.amount)}\nTo: ${currentTransferData.name} (${bankList.find(b => b.code === currentTransferData.bank)?.name || currentTransferData.bank})\nDate: ${currentTransferData.timestamp}`;
  if (navigator.clipboard) { navigator.clipboard.writeText(text); showToast('Receipt details copied to clipboard!', 'success'); }
  else showToast('Share: ' + currentTransferData.ref, 'success');
}

/* ── Amount Preview ── */
function updateAmountPreview() {
  const raw = document.getElementById('amount')?.value || '';
  const cleaned = raw.replace(/,/g, '');
  const amt = parseFloat(cleaned) || 0;
  const box = document.getElementById('amountPreviewBox');
  if (box) {
    if (amt > 0) {
      box.style.display = 'flex';
      document.getElementById('amountPreviewVal').textContent = fmtNaira(amt + 50);
      const fee = amt <= 5000 ? 10 : amt <= 50000 ? 25 : 50;
      document.getElementById('txnFee').value = `₦${fee}.00 (Standard)`;
    } else {
      box.style.display = 'none';
    }
  }
}

/* ── Reset Transfer ── */
function resetTransfer() {
  ['sourceAccount','recipientBank','recipientAcct','recipientName','amount','narration'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (el.tagName === 'SELECT') el.value = '';
      else el.value = '';
    }
  });
  const box = document.getElementById('amountPreviewBox');
  if (box) box.style.display = 'none';
  const verified = document.getElementById('verifiedName');
  if (verified) verified.style.display = 'none';
  pinValue = ''; updatePinDots();
  setStep(1);
}

/* ── Modal ── */
function openModal(id) { const el = document.getElementById(id); if (el) el.classList.add('open'); }
function closeModal(id) { const el = document.getElementById(id); if (el) el.classList.remove('open'); }

/* ── Toast ── */
let toastTimer;
function showToast(msg, type='success') {
  ensureToast(); // make sure it exists
  const t = document.getElementById('toast');
  if (!t) return;
  const msgSpan = document.getElementById('toastMsg');
  if (msgSpan) msgSpan.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ── Errors ── */
function showErr(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'block';
}
function hideErr(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'none';
}

/* ── Format Naira ── */
function fmtNaira(n) {
  return '₦' + Math.abs(n).toLocaleString('en-NG', {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* ── Section Navigation ── */
function showSection(id) {
  document.querySelectorAll('main > section').forEach(s => s.style.display = 'none');
  const target = document.getElementById('sec-' + id);
  if (target) target.style.display = 'block';
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(item => {
    if (item.getAttribute('onclick') && item.getAttribute('onclick').includes("'"+id+"'")) {
      item.classList.add('active');
    }
  });
  window.scrollTo(0,0);
}

/* ── Tab Switcher ── */
function switchTab(btn, targetId) {
  const panel = btn.closest('.panel');
  if (!panel) return;
  const tabs = panel.querySelectorAll('.tab-btn');
  tabs.forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const contents = panel.querySelectorAll('.tab-content');
  contents.forEach(c => c.classList.remove('active'));
  const target = document.getElementById(targetId);
  if (target) target.classList.add('active');
}

/* ── Open Transfer with account preset ── */
function openTransferWithAccount(name, id) {
  showSection('transfer');
  const sel = document.getElementById('sourceAccount');
  if (!sel) return;
  if (name.includes('Investment')) sel.value = 'inv';
  else if (name.includes('Current')) sel.value = 'cur';
  else if (name.includes('Savings')) sel.value = 'sav';
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded', () => {
  populateBankDropdown();
  loadDashboard();
  setStep(1);
  // Close modal on overlay click
  document.querySelectorAll('.modal-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('open'); });
  });
  // Ensure toast exists (it should, but just in case)
  ensureToast();
});
</script>
